name: Publish validated Tylo Sauna release

on:
  workflow_run:
    workflows: ["Validate Tylo Sauna"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    if: >-
      ${{ github.event_name == 'workflow_dispatch' ||
          (github.event.workflow_run.conclusion == 'success' &&
           github.event.workflow_run.head_repository.full_name == github.repository) }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout validated source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          persist-credentials: false

      - name: Publish verified current version for HACS
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VALIDATED_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: |
          set -euo pipefail
          current_sha="$(git ls-remote origin refs/heads/main | cut -f1)"
          if [[ "$VALIDATED_SHA" != "$current_sha" ]]; then
            echo "Skipping stale commit $VALIDATED_SHA (main is $current_sha)"
            exit 0
          fi
          VERSION="$(python3 -c 'import json; print(json.load(open("custom_components/tylo_sauna/manifest.json"))["version"])')"
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid stable version: $VERSION" >&2
            exit 1
          fi
          if gh release view "v$VERSION" >/dev/null 2>&1; then
            echo "Release v$VERSION already exists"
            exit 0
          fi
          if [[ -f "RELEASE_NOTES_$VERSION.md" ]]; then
            gh release create "v$VERSION" \
              --target "$VALIDATED_SHA" \
              --title "Tylo Sauna v$VERSION" \
              --notes-file "RELEASE_NOTES_$VERSION.md"
          else
            gh release create "v$VERSION" \
              --target "$VALIDATED_SHA" \
              --title "Tylo Sauna v$VERSION" \
              --generate-notes
          fi
